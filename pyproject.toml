[project]
name = "micro-hero-bot"
version = "0.1.0"
description = "Telegram бот для управління ігротекою"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "aiogram>=3.0.0",
    "sqlmodel>=0.0.14",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["database", "handlers", "keyboards", "services", "utils"]
