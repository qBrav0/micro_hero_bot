name: Docker Build Test

# Цей workflow перевіряє, що Docker образ успішно збирається
# Запускається при кожному push та pull request

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      run: docker build -t micro-hero-bot:test .
    
    - name: Test image
      run: |
        echo "✅ Docker образ успішно зібрано"
        docker images micro-hero-bot:test

