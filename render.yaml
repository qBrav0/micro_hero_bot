# Render.com конфігурація
# Документація: https://render.com/docs/yaml-spec

services:
  - type: pserv
    name: micro-hero-bot
    env: docker
    region: frankfurt  # Європа, близько до України
    plan: free
    
    # Змінні середовища (секретні додайте через UI)
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/gameclub.db
      - key: CLUB_NAME
        value: Герої на полицях
      - key: CLUB_DESCRIPTION
        value: Ігротека настільних ігор
      # BOT_TOKEN та ADMIN_IDS додайте через Render Dashboard
    
    # Persistent disk для бази даних
    disk:
      name: bot-data
      mountPath: /app/data
      sizeGB: 1

